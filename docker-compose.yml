# Start KaamBill with one command:   docker compose up --build
# Then open http://localhost:3000  (landing page; the live app is at http://localhost:3000/app/).
#
# No secret key is needed to start. Without GROQ_API_KEY the app shows its screens and a "Groq key not
# set" message when you ask it to build a bill. To enable bill extraction, put your key in a .env file
# next to this file (copy .env.example) or export it:   GROQ_API_KEY=gsk_... docker compose up --build
services:
  kaambill:
    build: .
    image: kaambill
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
